# Build and publish to GitHub Pages.
#
# DEPLOY IS GATED ON THE TEST SUITE. The previous version ran build then
# deploy with no test dependency, so a red suite shipped to Pages. The `test`
# job below calls .github/workflows/test.yml through workflow_call, and both
# build and sbom wait on it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # The full suite: typecheck, lint, and tests. Defined once in test.yml so
  # the branch runs and the release gate can never check different things.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Was hardcoded '20' while test.yml read .nvmrc. Two sources for one
          # number is a drift waiting to happen, so both read the file.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, not `npm install`. install resolves fresh and can build
      # against dependency versions the test job never ran, which defeats the
      # point of gating the deploy on tests at all.
      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      # Sanity check: tests/ must never reach the static export.
      - name: Assert no test file in out
        run: |
          if find out -name '*.test.*' -print -quit | grep -q .; then
            echo "::error::Test files found in out/ - static export contaminated"
            find out -name '*.test.*'
            exit 1
          fi

      # Bundle-size budgets, two of them. Initial-load counts the chunks
      # out/index.html references (what a browser fetches before first
      # paint); total counts every chunk including lazy ones. Baseline
      # measured 2026-09-05: initial 3,138,673 B, total 10,654,516 B; total
      # re-measured after B.1 (seals out of JS) at 6,809,010 B; initial
      # re-measured after B.4 (pdf-lib and jszip lazy) at 2,655,337 B.
      # Budgets are baseline plus ~10%. Lower them in the PR which
      # achieves a reduction; raise them only in a PR which justifies the
      # growth, so bundle changes are a review conversation.
      - name: Bundle-size budgets
        run: node scripts/bundle-report.mjs --initial-budget=2920000 --total-budget=7490000

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # SBOM runs in parallel with build. It is a DEPLOY GATE: the deploy job
  # below waits on it, so a build ships only with its SBOM produced and
  # validated. The generator reads the lockfile and installed tree, so a
  # failure here is a real signal about the dependency tree, not a flake.
  sbom:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM
        run: npm run sbom

      # A zero-exit generator can still leave an empty or shapeless file.
      # Check the artifact itself: right subject, every direct production
      # dependency present, and the fields that make it machine-usable.
      - name: Validate SBOM
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const sbom = JSON.parse(readFileSync("sbom.cdx.json", "utf-8"));
            const pkg = JSON.parse(readFileSync("package.json", "utf-8"));
            const fail = (msg) => { console.error(`::error::SBOM ${msg}`); process.exit(1); };
            if (sbom.bomFormat !== "CycloneDX") fail(`bomFormat is ${sbom.bomFormat}, expected CycloneDX`);
            if (sbom.metadata?.component?.name !== pkg.name) fail(`describes "${sbom.metadata?.component?.name}", expected "${pkg.name}"`);
            const components = sbom.components ?? [];
            if (components.length === 0) fail("lists no components");
            const present = new Set(components.map((c) => (c.group ? `${c.group}/${c.name}` : c.name)));
            const missing = Object.keys(pkg.dependencies ?? {}).filter((d) => !present.has(d));
            if (missing.length) fail(`omits production dependencies: ${missing.join(", ")}`);
            for (const field of ["purl", "version"]) {
              const bad = components.filter((c) => !c[field]?.length);
              if (bad.length) fail(`has ${bad.length} component(s) with no ${field} (e.g. ${bad[0].name})`);
            }
            console.log(`SBOM OK: ${components.length} components, ${Object.keys(pkg.dependencies ?? {}).length} direct prod deps present`);
          '

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, sbom]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
