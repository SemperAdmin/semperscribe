# Create a GitHub release when package.json's version changes on main.
#
# WHY. Until v0.2.0 the project had no version, tag, or changelog, so a
# user reporting a bug had no build identifier to cite and a reviewer had
# no release to audit. Every change that ships now bumps the version and
# adds a CHANGELOG.md entry; the push to main is the release trigger.
#
# Idempotent: skips when the tag already exists, so re-runs and pushes
# that leave the version alone are safe. Release notes are the matching
# CHANGELOG.md section.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to do."
            exit 0
          fi
          # Notes = this version's CHANGELOG section, body under the heading.
          awk -v n="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\["n"\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            printf 'Release %s\n' "$tag" > notes.md
          fi
          gh release create "$tag" --target "${{ github.sha }}" --title "$tag" --notes-file notes.md
