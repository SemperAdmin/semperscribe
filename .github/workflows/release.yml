# Create a GitHub release when package.json's version changes on main.
#
# WHY. Until v0.2.0 the project had no version, tag, or changelog, so a
# user reporting a bug had no build identifier to cite and a reviewer had
# no release to audit. Every change that ships now bumps the version and
# adds a CHANGELOG.md entry; the push to main is the release trigger.
#
# Idempotent: skips when the tag already exists, so re-runs and pushes
# that leave the version alone are safe. Release notes are the matching
# CHANGELOG.md section.
#
# Hardened 2026-10-21. The job runs on main only: a manual dispatch from
# another branch would otherwise publish that branch's package.json as a
# release of main. The version reaches the shell through an environment
# variable, never through `${{ }}` inside a run block, and is checked
# against the semver shape before it names a tag, so a crafted version
# string is a failed step and not a shell command.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate version
        id: v
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::package.json version '$version' is not a semver string. No release made."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Nothing to do."
            exit 0
          fi
          # Notes = this version's CHANGELOG section, body under the heading.
          # The version is dotted, so it is matched literally, not as a pattern.
          awk -v n="$VERSION" '
            index($0, "## [" n "]") == 1 { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            printf 'Release %s\n' "$tag" > notes.md
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
