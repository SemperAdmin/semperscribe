# Dependency update feed. Security advisories against production
# dependencies fail CI through `npm audit` in test.yml; this keeps the
# rest of the tree from drifting into an advisory later. Grouped so a
# week's minor and patch bumps arrive as one PR the test suite gates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # The PDF renderer gets its own PR. 4.9.0 emitted flate streams
        # pdf.js rejects under Node (every text-layer test read an empty
        # page), and one bad renderer release must not hold back the
        # other thirty updates in the week's group.
        exclude-patterns: ["@react-pdf/*"]
    ignore:
      # Exact pins with a reason recorded in package.json ("//"): bump
      # deliberately, not by feed.
      - dependency-name: pdfjs-dist
      - dependency-name: mammoth
      # zod 4.5.x carries a schema compiler on the classic import path,
      # +83 KB of initial-load JS (docs/audits/2026-09-05/bundle-attribution.md).
      - dependency-name: zod
      # typescript is exact-pinned (package.json "//", P7-4): a minor
      # compiler release can fail typecheck with no code change.
      - dependency-name: typescript
      # Major versions are a review conversation, never an auto-PR.
      # eslint 10 is the exception on the list, not in it: measured
      # 2026-09-07, eslint@10.10.0 fails at load ("contextOrFilename.
      # getFilename is not a function" from eslint-plugin-react@7.37.5,
      # which eslint-config-next@16.3.4 pins). Take 10 when
      # eslint-config-next ships a plugin set declaring an eslint 10
      # peer (audit P7-3).
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
