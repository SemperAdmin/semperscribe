# Response security headers for the cloud.gov deployment.
# Merged into `location /` by the Staticfile location_include directive.
# `always` sets each header on every response, error pages included.
# Audit 2026-09-08 finding 1: the deployed static app sent none of these.

# Clickjacking. frame-ancestors is the modern control, X-Frame-Options
# the legacy one. Both say the app is never framed.
# script-src carries 'wasm-unsafe-eval'. The PDF preview and export run
# through @react-pdf/renderer, whose layout engine (yoga) is WebAssembly,
# so WebAssembly.instantiate must be allowed. 'wasm-unsafe-eval' permits
# WASM compilation only, not general eval, and is honored by Chromium 97,
# Firefox 102, and Safari 16 and later. Verified 2026-09-08: without it
# the preview fails with a WebAssembly CSP CompileError.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com https://api.genai.mil http://127.0.0.1:* https://127.0.0.1:* http://localhost:* https://localhost:*; worker-src 'self' blob:; frame-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'" always;
add_header X-Frame-Options "DENY" always;

# MIME sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Transport. cloud.gov terminates TLS at the platform edge, so every
# served response reaches a browser over HTTPS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Referrer. The app links out to the Semper Admin portal; send no
# referrer with any navigation or request.
add_header Referrer-Policy "no-referrer" always;

# Feature access. The app uses none of these device APIs.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()" always;

# Cross-origin isolation of the browsing context.
add_header Cross-Origin-Opener-Policy "same-origin" always;
